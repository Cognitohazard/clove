name: Auto Merge Upstream

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  merge-clove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and attempt merge
        id: merge
        run: |
          git remote add upstream https://github.com/Huan-zhaojun/clove.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge upstream/main --no-edit; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 唯一可自动处理的冲突：front 子模块指针。
          # 本仓库 front 指向 Cognitohazard/clove-front，与上游不同源；
          # 始终保留本仓库版本，下一步会再同步到最新 origin/master。
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ "$conflicts" = "front" ]; then
            echo "Resolving front submodule conflict by keeping ours"
            git checkout --ours -- front
            git add front
            git commit --no-edit
            echo "updated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unresolvable conflicts in:"
          echo "$conflicts"
          git merge --abort
          echo "updated=conflict" >> "$GITHUB_OUTPUT"

      - name: Sync front submodule to latest origin
        if: steps.merge.outputs.updated != 'conflict'
        run: |
          cd front
          git fetch origin master
          LATEST=$(git rev-parse origin/master)
          if [ "$(git rev-parse HEAD)" != "$LATEST" ]; then
            git checkout "$LATEST"
            cd ..
            git add front
            git commit -m "chore: update front submodule after upstream sync" || true
          fi

      - name: Push changes
        if: steps.merge.outputs.updated != 'conflict'
        run: git push origin main || true

      - name: Report conflict
        if: steps.merge.outputs.updated == 'conflict'
        run: |
          echo "::warning title=Upstream merge conflict::Automatic merge of Huan-zhaojun/clove into Cognitohazard/clove failed due to conflicts. Please merge manually."
          exit 1
